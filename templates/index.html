<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxmox Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Proxmox Maintenance</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Select Node for Maintenance</h2>
            
            <div class="mb-4">
                <label for="nodeSelect" class="block text-sm font-medium text-gray-700 mb-2">Node:</label>
                <select id="nodeSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">Loading nodes...</option>
                </select>
            </div>
            
            <button id="startMaintenance" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50" disabled>
                Start Maintenance
            </button>
            
            <div id="status" class="mt-4 p-4 rounded-md hidden"></div>
        </div>
    </div>

    <script>
        const nodeSelect = document.getElementById('nodeSelect');
        const startMaintenance = document.getElementById('startMaintenance');
        const status = document.getElementById('status');

        // Fetch nodes on page load
        fetch('/api/nodes')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    nodeSelect.innerHTML = '<option value="">Select a node</option>' +
                        data.nodes.map(node => `<option value="${node}">${node}</option>`).join('');
                    startMaintenance.disabled = false;
                } else {
                    showStatus('Error loading nodes: ' + data.message, 'error');
                }
            })
            .catch(error => {
                showStatus('Error loading nodes: ' + error, 'error');
            });

        // Handle maintenance start
        startMaintenance.addEventListener('click', () => {
            const node = nodeSelect.value;
            if (!node) {
                showStatus('Please select a node', 'error');
                return;
            }

            startMaintenance.disabled = true;
            showStatus('Starting maintenance process...', 'info');

            fetch('/api/maintenance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ node }),
            })
            .then(response => response.json())
            .then(data => {
                showStatus(data.message, data.status);
                startMaintenance.disabled = false;
            })
            .catch(error => {
                showStatus('Error: ' + error, 'error');
                startMaintenance.disabled = false;
            });
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'mt-4 p-4 rounded-md';
            
            switch (type) {
                case 'success':
                    status.classList.add('bg-green-100', 'text-green-700');
                    break;
                case 'error':
                    status.classList.add('bg-red-100', 'text-red-700');
                    break;
                case 'info':
                    status.classList.add('bg-blue-100', 'text-blue-700');
                    break;
            }
            
            status.classList.remove('hidden');
        }
    </script>
</body>
</html>
